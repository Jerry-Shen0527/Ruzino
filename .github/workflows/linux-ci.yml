name: Linux CI

on:
  push:
    branches: [ agent-dev ]
  pull_request:
    branches: [ agent-dev ]

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CC: clang
  CXX: clang++

jobs:
  check-sdk:
    name: Check if SDK needs rebuild
    runs-on: [self-hosted, Linux]
    outputs:
      needs-rebuild: ${{ steps.check.outputs.needs-rebuild }}
      configure-hash: ${{ steps.check.outputs.configure-hash }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check SDK status
        id: check
        shell: bash
        run: |
          configureHash=$(sha256sum configure.py | awk '{print $1}')
          echo "configure-hash=$configureHash" >> $GITHUB_OUTPUT
          
          hashFile="SDK/.configure_hash_linux"
          tagName="sdk-linux-$configureHash"
          
          needsRebuild="true"
          
          # Check if SDK exists in GitHub Release
          export GH_TOKEN="${{ secrets.GH_PAT }}"
          if gh release view "$tagName" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Found release with tag: $tagName"
            needsRebuild="false"
          else
            echo "Release not found, will build SDK"
          fi
          
          echo "needs-rebuild=$needsRebuild" >> $GITHUB_OUTPUT

  build-sdk:
    name: Build SDK (Linux)
    needs: check-sdk
    if: needs.check-sdk.outputs.needs-rebuild == 'true'
    outputs:
      configure-hash: ${{ needs.check-sdk.outputs.configure-hash }}
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Enable Git long path support
        shell: bash
        run: git config --global core.longpaths true

      - name: Install Python dependencies
        shell: bash
        run: |
          /usr/bin/python3 -m pip install --user --break-system-packages -r requirements.txt || true

      - name: Build SDK (Debug)
        shell: bash
        run: |
          /usr/bin/python3 configure.py --all --build_variant Debug

      - name: Build SDK (Release)
        shell: bash
        run: |
          /usr/bin/python3 configure.py --all --build_variant Release

      - name: Verify SDK build output
        shell: bash
        run: |
          if [ ! -d "SDK" ] || [ -z "$(ls -A SDK 2>/dev/null)" ]; then
            echo "ERROR: SDK directory is empty or not found!"
            exit 1
          fi
          echo "SDK directory contents:"
          ls -la SDK/ | head -20

      - name: Pack SDK
        shell: bash
        run: |
          /usr/bin/python3 configure.py --pack
          
          if [ -f "SDK/SDK.zip" ]; then
            configureHash="${{ needs.check-sdk.outputs.configure-hash }}"
            mv SDK/SDK.zip "SDK/SDK-linux-${configureHash}.zip"
            size=$(du -h "SDK/SDK-linux-${configureHash}.zip" | cut -f1)
            echo "SDK packed successfully - Size: $size"
          else
            echo "ERROR: SDK.zip not created!"
            exit 1
          fi

      - name: Store configure hash
        shell: bash
        run: |
          configureHash="${{ needs.check-sdk.outputs.configure-hash }}"
          echo -n "$configureHash" > SDK/.configure_hash_linux

      - name: Upload SDK for workflow
        uses: actions/upload-artifact@v4
        with:
          name: sdk-build-linux
          path: SDK/SDK-linux-*.zip
          retention-days: 7

      - name: Upload SDK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: SDK/SDK-linux-*.zip
          tag_name: sdk-linux-${{ needs.check-sdk.outputs.configure-hash }}
          body: "Linux SDK build for configure.py hash: ${{ needs.check-sdk.outputs.configure-hash }}"
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
          token: ${{ secrets.GH_PAT }}

  build-project:
    name: Build Project (Linux)
    needs: [check-sdk, build-sdk]
    if: always()
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Enable Git long path support
        shell: bash
        run: git config --global core.longpaths true

      - name: Install Python dependencies
        shell: bash
        run: |
          /usr/bin/python3 -m pip install --user --break-system-packages -r requirements.txt || true
          /usr/bin/python3 -m pip install --user --break-system-packages pytest

      - name: Download SDK from workflow artifact
        if: needs.check-sdk.outputs.needs-rebuild == 'true'
        uses: actions/download-artifact@v4
        with:
          name: sdk-build-linux
          path: SDK/

      - name: Download SDK from GitHub Release
        if: needs.check-sdk.outputs.needs-rebuild == 'false'
        shell: bash
        run: |
          configureHash="${{ needs.check-sdk.outputs.configure-hash }}"
          tagName="sdk-linux-$configureHash"
          
          mkdir -p SDK
          export GH_TOKEN="${{ secrets.GH_PAT }}"
          gh release download "$tagName" --repo "${{ github.repository }}" -p "SDK-linux-${configureHash}.zip" -O "SDK/SDK-linux-${configureHash}.zip" || {
            echo "Failed to download SDK, will build from scratch"
            /usr/bin/python3 configure.py --all --build_variant Release
          }

      - name: Extract or Build SDK
        shell: bash
        run: |
          configureHash="${{ needs.check-sdk.outputs.configure-hash }}"
          sdkZip="SDK/SDK-linux-${configureHash}.zip"
          
          if [ -f "$sdkZip" ]; then
            echo "Extracting SDK..."
            /usr/bin/python3 configure.py --extract-sdk "$sdkZip" --build_variant Release || {
              echo "Extraction failed, building SDK..."
              /usr/bin/python3 configure.py --all --build_variant Release
            }
          else
            echo "Building SDK from scratch..."
            /usr/bin/python3 configure.py --all --build_variant Release
          fi

      - name: Verify SDK
        shell: bash
        run: |
          if [ ! -d "SDK" ] || [ -z "$(ls -A SDK 2>/dev/null)" ]; then
            echo "ERROR: SDK directory is empty or not found!"
            exit 1
          fi
          echo "SDK directory contents:"
          ls -la SDK/ | head -20

      - name: Configure CMake
        shell: bash
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_CXX_FLAGS="-Wno-enum-constexpr-conversion" \
            -DUSTC_HOMEWORK_PLUGINS=OFF \
            -DRUZINO_WITH_CUDA=OFF \
            ..

      - name: Build
        shell: bash
        run: |
          cd build
          cmake --build . --config Release -j$(nproc)

      - name: Run all tests
        shell: bash
        run: |
          /usr/bin/python3 scripts/run_all_tests.py || echo "Tests failed, but build succeeded"

      - name: Print summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       LINUX CI SUMMARY"
          echo "======================================"
          echo "SDK Hash: ${{ needs.check-sdk.outputs.configure-hash }}"
          echo "SDK Rebuilt: ${{ needs.check-sdk.outputs.needs-rebuild }}"
          echo "Compiler: Clang"
          echo "CUDA: Disabled"
          echo "USTC_HOMEWORK_PLUGINS: OFF"
          echo "======================================"
