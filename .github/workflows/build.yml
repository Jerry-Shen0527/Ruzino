name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Build the SDK even if a matching release exists
        type: boolean
        default: false
      gpu_tests:
        description: Also run Ruzino GPU tests on a self-hosted Windows runner
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk:
    name: Windows CUDA Release SDK
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      sdk-tag: ${{ steps.sdk-key.outputs.tag }}
      built: ${{ steps.sdk-key.outputs.build }}
    env:
      MSVC_VERSION: '14.44'
      PYTHON_VERSION: '3.13'
      CUDA_VERSION: '12.9.1'
      CUDAARCHS: '75;86;89'
      SDK_VARIANT: Release
      RUZINO_SDK_CLEAN_INTERMEDIATES: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Select MSVC v143 x64
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio 2022 with x64 C++ tools was not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $setup = Join-Path $env:RUNNER_TEMP 'ruzino-v143.cmd'
          @(
            '@echo off'
            ('call "{0}" x64 -vcvars_ver={1} >nul || exit /b 1' -f $vcvars, $env:MSVC_VERSION)
            'set'
          ) | Set-Content -LiteralPath $setup -Encoding ascii
          $variables = & cmd.exe /d /c $setup
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize v143' }
          $developerEnv = @{}
          foreach ($line in $variables) {
            if ($line -match '^([^=]+)=(.*)$') { $developerEnv[$Matches[1]] = $Matches[2] }
          }
          if ($developerEnv.VCToolsVersion -notlike "$env:MSVC_VERSION.*") {
            throw "Could not select MSVC $env:MSVC_VERSION x64"
          }
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsVersion', 'WindowsSDKVersion', 'VCINSTALLDIR') {
            "$name=$($developerEnv[$name])" >> $env:GITHUB_ENV
          }
          "V143_PATH=$($developerEnv.Path)" >> $env:GITHUB_ENV

      - name: Check for an SDK built with these inputs
        id: sdk-key
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_SDK_BUILD: ${{ inputs.force_rebuild || false }}
        run: |
          $key = python .github/scripts/windows-sdk-key.py
          if ($LASTEXITCODE -ne 0 -or $key -cnotmatch '^[0-9a-f]{64}$') { throw 'Could not compute SDK key' }
          $tag = "sdk-win-x64-release-cuda-$key"
          "tag=$tag" >> $env:GITHUB_OUTPUT

          $assets = & gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[] | select(.name == "SDK.zip" and .size > 0) | .name' 2>&1
          $lookupExit = $LASTEXITCODE
          if ($lookupExit -ne 0 -and "$assets" -notmatch 'release not found|HTTP 404') { throw "$assets" }
          $build = $env:FORCE_SDK_BUILD -eq 'true' -or $lookupExit -ne 0 -or $assets -notcontains 'SDK.zip'
          "build=$($build.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "SDK release: $tag (rebuild: $build)"
          exit 0

      - name: Install CUDA Toolkit components
        if: steps.sdk-key.outputs.build == 'true'
        shell: pwsh
        run: ./.github/scripts/install-windows-cuda.ps1 -Version $env:CUDA_VERSION

      - name: Initialize NVAPI headers
        if: steps.sdk-key.outputs.build == 'true'
        shell: pwsh
        run: |
          git -c core.longpaths=true submodule update --init -- external/nvapi
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out NVAPI' }

      - name: Build and package Release SDK
        if: steps.sdk-key.outputs.build == 'true'
        shell: pwsh
        run: |
          $env:Path = "$env:pythonLocation;$env:pythonLocation\Scripts;$env:CUDA_PATH\bin;$env:V143_PATH"
          python -m pip install requests tqdm
          if ($LASTEXITCODE -ne 0) { throw 'Could not install SDK build requirements' }

          $probe = Join-Path $env:RUNNER_TEMP 'cuda-probe.cu'
          '#include <cuda_runtime.h>', '__global__ void probe() {}', 'int main() { probe<<<1, 1>>>(); }' |
            Set-Content -LiteralPath $probe -Encoding ascii
          nvcc -std=c++17 -arch=sm_86 $probe -o "$env:RUNNER_TEMP\cuda-probe.exe"
          if ($LASTEXITCODE -ne 0) { throw 'nvcc could not compile and link with the selected v143 compiler' }

          function Write-FreeDisk {
            $drive = Get-PSDrive -Name (Get-Item -LiteralPath .).PSDrive.Name
            Write-Host ('Workspace disk free: {0:N2} GiB' -f ($drive.Free / 1GB))
          }

          Write-FreeDisk
          $timer = [Diagnostics.Stopwatch]::StartNew()
          try {
            Write-Host 'Compiling SDK dependencies'
            python .github/scripts/run-sdk-command.py "$env:RUNNER_TEMP/sdk-logs/compile.log" python configure.py --all --build_variant $env:SDK_VARIANT
            if ($LASTEXITCODE -ne 0) { throw 'SDK compilation failed' }
            Write-FreeDisk
            Write-Host 'Packing SDK.zip'
            python .github/scripts/run-sdk-command.py "$env:RUNNER_TEMP/sdk-logs/pack.log" python configure.py --pack
            if ($LASTEXITCODE -ne 0) { throw 'SDK packaging failed' }
          } finally {
            Write-FreeDisk
            "SDK build and packaging elapsed: $($timer.Elapsed)" >> $env:GITHUB_STEP_SUMMARY
          }

          $checkZip = @'
          import zipfile
          with zipfile.ZipFile("SDK/SDK.zip") as archive:
              names = set(archive.namelist())
              required = {
                  "OpenUSD/Release/include/pxr/pxr.h",
                  "OpenUSD/Release/include/openvdb/openvdb.h",
                  "OpenUSD/Release/include/nanovdb/cuda/DeviceBuffer.h",
                  "python/python313.dll",
                  "slang/include/nvHLSLExtns.h",
              }
              missing = required - names
              if not any(name in names for name in (
                  "OpenUSD/Release/bin/usd_ms.dll", "OpenUSD/Release/lib/usd_ms.dll"
              )):
                  missing.add("usd_ms.dll")
              if missing:
                  raise SystemExit(f"SDK is missing: {sorted(missing)}")
          '@
          $checkZip | python -
          if ($LASTEXITCODE -ne 0) { throw 'SDK archive is incomplete' }

      - name: Upload detailed SDK logs
        if: always() && steps.sdk-key.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-logs
          path: ${{ runner.temp }}/sdk-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload SDK for this workflow
        if: steps.sdk-key.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-build
          path: SDK/SDK.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish SDK to GitHub Releases
        if: steps.sdk-key.outputs.build == 'true' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ steps.sdk-key.outputs.tag }}
        run: |
          $pythonVersion = python -c "import sys; print(sys.version.split()[0])"
          $notes = "Windows x64 Release | MSVC $env:VCToolsVersion | Python $pythonVersion | CUDA $env:CUDA_VERSION | SM $env:CUDAARCHS"
          $existing = & gh release view $env:SDK_TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:SDK_TAG SDK/SDK.zip --clobber --repo $env:GITHUB_REPOSITORY
          } elseif ("$existing" -match 'release not found|HTTP 404') {
            gh release create $env:SDK_TAG SDK/SDK.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title $env:SDK_TAG --notes $notes
          } else {
            throw "$existing"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish SDK release' }

  build-without-cuda:
    name: Build Project (No CUDA)
    needs: sdk
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download SDK from this workflow
        if: needs.sdk.outputs.built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: sdk-build
          path: SDK/

      - name: Download SDK from GitHub Release
        if: needs.sdk.outputs.built == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ needs.sdk.outputs.sdk-tag }}
        run: |
          New-Item -ItemType Directory -Path SDK -Force | Out-Null
          gh release download $env:SDK_TAG --repo $env:GITHUB_REPOSITORY -p SDK.zip -O SDK/SDK.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download SDK from $env:SDK_TAG" }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install Python dependencies
        run: |
          python -m pip install requests tqdm
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Python dependencies' }

      - name: Extract SDK and setup structure for builds
        shell: cmd
        run: |
          REM Extract SDK and setup Binaries structure using configure.py
          python configure.py --extract-sdk SDK/SDK.zip --build_variant Release
          if %ERRORLEVEL% neq 0 (
            echo Failed to extract SDK
            exit /b %ERRORLEVEL%
          )

      - name: Setup MSVC Build Tools
        shell: cmd
        run: |
          REM Try to find and initialize Visual Studio environment
          if exist "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
            echo MSVC environment initialized from Community edition
          ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat"
            echo MSVC environment initialized from Professional edition
          ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
            echo MSVC environment initialized from Enterprise edition
          ) else (
            echo WARNING: Visual Studio not found at expected locations
            echo Continuing anyway - system PATH may have compiler
          )

      - name: Configure CMake (No CUDA)
        shell: cmd
        run: |
          REM Initialize MSVC environment first
          if exist "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat"
          ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          )

          REM Configure CMake
          set buildDir=build_nocuda
          if exist "%buildDir%" (
            rmdir /s /q "%buildDir%"
          )
          mkdir "%buildDir%"
          cd /d "%buildDir%"

          cmake -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DRUZINO_WITH_CUDA=OFF ^
            -DCMAKE_INSTALL_PREFIX="../install_nocuda" ^
            ..

          if %ERRORLEVEL% neq 0 (
            echo CMake configuration failed
            exit /b %ERRORLEVEL%
          )

      - name: Build (No CUDA)
        id: build-nocuda
        shell: cmd
        run: |
          REM Initialize MSVC environment
          if exist "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat"
          ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          )

          cd /d build_nocuda
          cmake --build . --config Release -j
          if %ERRORLEVEL% neq 0 (
            echo Build failed with error code %ERRORLEVEL%
            exit /b %ERRORLEVEL%
          )

  build-and-test-with-cuda:
    name: Build & Test Project (With CUDA)
    needs: sdk
    if: github.event_name == 'workflow_dispatch' && inputs.gpu_tests
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download SDK from this workflow
        if: needs.sdk.outputs.built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: sdk-build
          path: SDK/

      - name: Download SDK from GitHub Release
        if: needs.sdk.outputs.built == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ needs.sdk.outputs.sdk-tag }}
        run: |
          New-Item -ItemType Directory -Path SDK -Force | Out-Null
          gh release download $env:SDK_TAG --repo $env:GITHUB_REPOSITORY -p SDK.zip -O SDK/SDK.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not download SDK from $env:SDK_TAG" }

      - name: Install SDK script dependencies
        shell: powershell
        run: |
          python -m pip install requests tqdm
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Python dependencies' }

      - name: Extract SDK and setup structure for Release build
        shell: cmd
        run: |
          REM Extract SDK and setup Binaries structure for Release variant
          python configure.py --extract-sdk SDK/SDK.zip --build_variant Release
          if %ERRORLEVEL% neq 0 (
            echo Failed to extract SDK for Release
            exit /b %ERRORLEVEL%
          )

      - name: Check CUDA availability
        id: cuda-check
        shell: powershell
        run: |
          try {
            $cuda_available = $false

            # Check CUDA_PATH environment variable
            if ($env:CUDA_PATH) {
              Write-Output "Found CUDA_PATH: $env:CUDA_PATH"
              $cuda_available = $true
            }

            # Also check common CUDA installation locations
            if (-not $cuda_available) {
              $common_paths = @(
                "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6",
                "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.5",
                "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4",
                "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.3"
              )

              foreach ($path in $common_paths) {
                if (Test-Path -Path "$path\bin\nvcc.exe") {
                  Write-Output "Found CUDA at: $path"
                  $env:CUDA_PATH = $path
                  $cuda_available = $true
                  break
                }
              }
            }

            if ($cuda_available) {
              Write-Output "cuda-available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Output "CUDA is available"
              & "$env:CUDA_PATH\bin\nvcc.exe" --version
            } else {
              Write-Output "cuda-available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Output "CUDA not found"
            }
          } catch {
            Write-Output "cuda-available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Output "CUDA check error: $_"
          }

      - name: Setup MSVC Build Tools
        shell: cmd
        run: |
          REM Try to find and initialize Visual Studio environment
          if exist "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
            echo MSVC environment initialized from Community edition
          ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat"
            echo MSVC environment initialized from Professional edition
          ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
            echo MSVC environment initialized from Enterprise edition
          ) else (
            echo WARNING: Visual Studio not found at expected locations
            echo Continuing anyway - system PATH may have compiler
          )

      - name: Configure CMake Release (With CUDA)
        if: steps.cuda-check.outputs.cuda-available == 'true'
        shell: cmd
        run: |
          REM Initialize MSVC environment
          if exist "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat"
          ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          )

          set buildDir=build_cuda_release
          if exist "%buildDir%" (
            rmdir /s /q "%buildDir%"
          )
          mkdir "%buildDir%"
          cd /d "%buildDir%"

          cmake -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DRUZINO_WITH_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=75;86;89 ^
            -DCMAKE_INSTALL_PREFIX="../install_cuda" ^
            ..

          if %ERRORLEVEL% neq 0 (
            echo CMake configuration failed for Release
            exit /b %ERRORLEVEL%
          )

      - name: Build (With CUDA)
        id: build-cuda
        if: steps.cuda-check.outputs.cuda-available == 'true'
        shell: cmd
        run: |
          REM Initialize MSVC environment
          if exist "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat"
          ) else if exist "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          )

          cd /d build_cuda_release
          cmake --build . --config Release -j
          if %ERRORLEVEL% neq 0 (
            echo Release build failed with error code %ERRORLEVEL%
            exit /b %ERRORLEVEL%
          )

      - name: CUDA not available
        if: steps.cuda-check.outputs.cuda-available == 'false'
        shell: powershell
        run: |
          Write-Output "CUDA is not available on this runner"
          Write-Output "Skipping CUDA build"

      - name: Install Python test dependencies
        if: steps.cuda-check.outputs.cuda-available == 'true'
        shell: powershell
        run: |
          Write-Output "Installing Python test dependencies..."
          python -m pip install --upgrade pip
          python -m pip install pytest
          Write-Output "✓ Test dependencies installed"

      - name: Run all tests
        id: run-tests
        if: steps.cuda-check.outputs.cuda-available == 'true'
        shell: powershell
        run: |
          Write-Output "Starting test suite..."
          python scripts/run_all_tests.py

          if ($LASTEXITCODE -eq 0) {
            Write-Output "test-status=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Output "✓ All tests passed"
          } else {
            Write-Output "test-status=failed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Output "✗ Some tests failed"
            exit 1
          }
